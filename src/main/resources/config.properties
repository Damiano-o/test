# CiboAmico — modalità di persistenza (NFR-01)
# Valori ammessi: DEMO (in-memory, default) | FS (JSON locale) | JDBC (MySQL)
persistence_type=DEMO

# Salt per l'hash SHA-256 delle password (NFR-03).
# NON hardcoded nel codice: letto a runtime da qui (evita Security Hotspot).
ciboamico.salt=ciboamico-salt
