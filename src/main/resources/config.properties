# CiboAmico — configurazione applicativa

# ============================================================
# Modalità di persistenza 
# Valori ammessi: DEMO (in-memory, default) | FS (JSON locale) | JDBC (MySQL)
# ============================================================
persistence_type=DEMO

# ============================================================
# Salt per l'hash SHA-256 delle password 
# NON hardcoded nel codice: letto a runtime da qui.
# ============================================================
ciboamico.salt=ciboamico-salt

# ============================================================
# Credenziali JDBC/MySQL 
# Usate dal ConnectionManager quando persistence_type=JDBC.
# NON hardcoded nel codice: lette a runtime da qui tramite AppConfig.
# ============================================================
ciboamico.db.url=jdbc:mysql://localhost:3306/ciboamico
ciboamico.db.user=root
ciboamico.db.password=root
